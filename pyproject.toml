[project]
name = "stacksim"
version = "0.0.3"
description = "A teaching tool that runs small C programs in a virtual machine and visualizes the stack and the heap step by step."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
stacksim = "stacksim.app:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
